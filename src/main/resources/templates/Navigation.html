<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body>
    <nav th:fragment="navbar()" class="navbar">
        <a href="/home" class="nav-logo">
            <i class="fa-solid fa-fire-burner"></i> Food Fiesta
        </a>
        <div class="nav-links">
            <a href="/home">Home</a>
            <a href="/products">Menu</a>
            <a href="/location">Location</a>
            <a href="/about">Story</a>
            <a th:if="${session.loggedInUser}" href="/cart" style="display: inline-flex; align-items: center; gap: 6px; font-weight: 500;">
                <i class="fa-solid fa-cart-shopping" style="color: var(--primary);"></i> Cart
                <span th:if="${session.cart != null && !session.cart.isEmpty()}" 
                      th:text="'(' + ${session.cart.size()} + ')'"
                      style="background: var(--primary); color: white; padding: 2px 6px; border-radius: 99px; font-size: 0.75rem; font-weight: bold; line-height: 1;">(2)</span>
            </a>
            <a th:if="${session.loggedInUser}" href="/dashboard" class="btn btn-outline">Dashboard</a>
            <!-- Conditional links for logged-in Admins -->
            <a th:if="${session.loggedInAdmin}" href="/admin/services" class="btn btn-outline">Admin Portal</a>
            <!-- Logout if anyone is logged in -->
            <a th:if="${session.loggedInUser != null || session.loggedInAdmin != null}" href="/logout" class="btn btn-primary">Sign Out</a>
            <!-- Sign In if no one is logged in -->
            <a th:if="${session.loggedInUser == null && session.loggedInAdmin == null}" href="/login" class="btn btn-primary">Sign In</a>
        </div>
    </nav>
</body>
</html>
