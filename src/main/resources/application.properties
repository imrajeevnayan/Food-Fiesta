# --- Datasource: PostgreSQL + PostGIS (single source of truth) ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/foodfiesta}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}

# --- JPA / Hibernate ---
# Flyway owns the schema; Hibernate only validates entity mappings against it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# --- Flyway (versioned migrations, incl. PostGIS extension + geometry) ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- Redis Geo (real-time driver locations) ---
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# --- Kafka (smart order routing) ---
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=food-fiesta
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.demo.events
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.listener.missing-topics-fatal=false

# --- Spring AI (OpenAI) ---
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.options.model=${OPENAI_CHAT_MODEL:gpt-4o-mini}

# --- External map routing (OSRM-compatible) guarded by Resilience4j ---
foodfiesta.map.base-url=${MAP_ROUTING_BASE_URL:https://router.project-osrm.org}
resilience4j.circuitbreaker.instances.mapRouting.sliding-window-size=10
resilience4j.circuitbreaker.instances.mapRouting.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.mapRouting.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.mapRouting.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.mapRouting.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.mapRouting.automatic-transition-from-open-to-half-open-enabled=true

# --- Concurrency: virtual threads for high-fanout WebSocket/HTTP handling ---
spring.threads.virtual.enabled=true

# --- API docs ---
springdoc.packages-to-scan=com.example.demo
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.show-actuator=true

# --- OAuth2 ---
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:YOUR_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:YOUR_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email
